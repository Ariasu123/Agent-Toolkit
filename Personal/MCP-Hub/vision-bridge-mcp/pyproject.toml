[project]
name = "vision-bridge-mcp"
version = "0.1.0"
description = "Give text-only LLMs (e.g. DeepSeek) image understanding via any OpenAI-compatible vision API, exposed as a stdio MCP server"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ariasu" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29,<2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
vision-bridge-mcp = "vision_bridge_mcp.server:main"

[project.urls]
Repository = "https://github.com/Ariasu123/Agent-Toolkit/tree/main/Personal/MCP-Hub/vision-bridge-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_bridge_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
